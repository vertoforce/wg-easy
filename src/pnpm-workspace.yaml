allowBuilds:
  '@parcel/watcher': false
  argon2: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeStrict: true

publicHoistPattern:
  - '@intlify/utils'
  - '@intlify/h3'
  - 'h3'
  - 'nitropack'
  - 'ofetch'

# armv7 custom build (vertoforce, 2026-10-21): security bumps over the v15.4.0 lockfile.
overrides:
  devalue: ^5.9.4
